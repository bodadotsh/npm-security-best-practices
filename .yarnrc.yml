# https://yarnpkg.com/configuration/yarnrc

# Pin exact versions on `yarn add` (no ^ or ~ prefix)
defaultSemverRangePrefix: ''

# Never let installs mutate the lockfile (default on CI only)
enableImmutableInstalls: true

# Re-verify lockfile entries against the registry on install
enableHardenedMode: true

# Block all git dependencies unless explicitly allowlisted (Yarn 4.14+)
approvedGitRepositories: []

# Never run lifecycle scripts (postinstall/preinstall/install) from dependencies
enableScripts: false

# Refuse versions published less than x days ago (npm's unpublish window)
npmMinimalAgeGate: 4320 # 3 days

# Exempt only your own scoped packages from the age gate
# npmPreapprovedPackages:
#  - "@your-org/*"

# Attach a signed provenance statement when publishing
npmPublishProvenance: true

# Per-project cache: avoids cross-project cache poisoning
enableGlobalCache: false

# No telemetry / no interactive prompts in CI
enableTelemetry: false
preferInteractive: false

# Pin the Yarn binary so the config is enforced by a known version
# yarnPath: .yarn/releases/yarn-4.18.0.cjs
